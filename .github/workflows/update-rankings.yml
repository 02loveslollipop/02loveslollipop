name: Update Rankings and Weekly Projects

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * *" # Refresh the rolling last 7 days daily at 06:17 UTC
  workflow_dispatch:      # Allows manual run from GitHub Actions tab

concurrency:
  group: profile-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # This entry point generates both cards from the same rolling 168-hour
      # collection of public pushes across all branches.
      - name: Update rankings and rolling 7-day projects
        env:
          PROFILE_USERNAME: 02loveslollipop
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_use_to_code.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/cards/code-ranking.svg assets/cards/weekly-repos.svg scripts/.cache/jupyter_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update use-to-code rankings and weekly repos [skip ci]"
            git push
          else
            echo "No changes detected in rankings."
          fi
